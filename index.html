<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS-EL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif}
body{background:#222;background-image:radial(#333 1px,transparent 1px);background-size:20px 20px;padding:1rem}
.container{max-width:420px;margin:0 auto;background:#000;border-radius:20px;overflow:hidden;border:3px solid #2563eb;box-shadow:0 0 25px #2563eb44}
.header{background:linear-gradient(90deg,#1d4ed8,#3b82f6);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:19px}
.header-pin{font-size:16px;opacity:0.9}

.contact-list{background:#000}
.contact-item{display:flex;gap:12px;padding:12px 16px;border-bottom:#222 solid 1px;align-items:center;cursor:pointer;transition:0.2s}
.contact-item:hover{background:#111}
.avatar{width:46px;height:46px;border-radius:50%;background:#3366cc;color:#fff;display:grid;place-items:center;font-weight:bold;font-size:18px}
.contact-info h3{color:#fff;font-size:16px}
.contact-info p{color:#888;font-size:13px;margin-top:2px}

.chat-screen{display:none;height:580px;background:#111;flex-direction:column}
.chat-topbar{background:#1d4ed8;color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center}
.back-btn{background:#fff2;border:0;color:#fff;padding:4px 9px;border-radius:8px;cursor:pointer}
.chat-area{flex:1;padding:14px;overflow-y:auto}
.msg{margin:8px 0;max-width:75%}
.msg.out{margin-left:auto}
.msg-bubble{padding:9px 12px;border-radius:12px;font-size:14px}
.msg.in .msg-bubble{background:#333;color:#fff;border-bottom-left-radius:3px}
.msg.out .msg-bubble{background:#2563eb;color:#fff;border-bottom-right-radius:3px}
.status{font-size:11px;color:#777;text-align:right;margin-top:2px}

.chat-input-area{display:flex;padding:10px;background:#000;gap:8px}
#msgInput{flex:1;padding:10px;border-radius:12px;border:0;outline:none}
.btn{border:0;padding:0 14px;border-radius:12px;font-weight:bold;cursor:pointer;height:40px}
.send{background:#2563eb;color:#fff}
.ping{background:#dc2626;color:#fff}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span>POS-EL</span>
    <span class="header-pin">PIN: 7A2B9C0E</span>
  </div>

  <div id="contactPage" class="contact-list">
    <div class="contact-item" onclick="openChat('Teman A','91F28D44')">
      <div class="avatar">A</div>
      <div class="contact-info">
        <h3>Teman A</h3>
        <p>91F28D44</p>
      </div>
    </div>
    <div class="contact-item" onclick="openChat('Teman B','C7710FA3')">
      <div class="avatar">B</div>
      <div class="contact-info">
        <h3>Teman B</h3>
        <p>C7710FA3</p>
      </div>
    </div>
    <div class="contact-item" onclick="openChat('Teman C','22BB5E77')">
      <div class="avatar">C</div>
      <div class="contact-info">
        <h3>Teman C</h3>
        <p>22BB5E77</p>
      </div>
    </div>
  </div>

  <div id="chatPage" class="chat-screen">
    <div class="chat-topbar">
      <button class="back-btn" onclick="closeChat()">←</button>
      <div class="avatar" id="chatAvatar">A</div>
      <div>
        <div id="chatName">Teman A</div>
        <div style="font-size:12px;opacity:0.8" id="chatPin">91F28D44</div>
      </div>
    </div>
    <div class="chat-area" id="chatBox"></div>
    <div class="chat-input-area">
      <input id="msgInput" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="btn send" onclick="sendMsg()">Kirim</button>
      <button class="btn ping" onclick="sendPing()">PING!</button>
    </div>
  </div>
</div>

<script>
const audioPing = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3");
let currentName,currentPin;

function openChat(n,p){
  currentName=n;currentPin=p;
  document.getElementById("chatName").textContent=n;
  document.getElementById("chatPin").textContent=p;
  document.getElementById("chatAvatar").textContent=n.slice(-1);
  document.getElementById("contactPage").style.display="none";
  document.getElementById("chatPage").style.display="flex";
}

function closeChat(){
  document.getElementById("contactPage").style.display="block";
  document.getElementById("chatPage").style.display="none";
}

function addMsg(text,tipe,stat="S"){
  const box=document.getElementById("chatBox");
  const d=document.createElement("div");
  d.className="msg "+tipe;
  d.innerHTML=`<div class="msg-bubble">${text}</div><div class="status">${stat}</div>`;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function sendMsg(){
  const input = document.getElementById("msgInput");
  const teks = input.value.trim();
  if(!teks) return;
  addMsg(teks,"out","S");
  input.value="";

  setTimeout(()=>{
    let last = document.querySelector(".msg.out:last-child .status");
    if(last) last.textContent="D";
  }, 800);
  setTimeout(()=>{
    let last = document.querySelector(".msg.out:last-child .status");
    if(last) last.textContent="R";
  }, 1600);
}

function sendPing(){
  audioPing.currentTime=0;
  audioPing.play();
  addMsg("PING!","out","S");
  setTimeout(()=>{
    let last = document.querySelector(".msg.out:last-child .status");
    if(last) last.textContent="D";
  }, 800);
  setTimeout(()=>{
    let last = document.querySelector(".msg.out:last-child .status");
    if(last) last.textContent="R";
    addMsg("PONG! 🏓","in");
  }, 1600);
}
</script>
</body>
</html>
