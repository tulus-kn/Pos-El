name: posel-v4326
on:
  push:
    paths: ['.github/posel_v4326.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/XVY0Xw6D1U" -o new.html
          md5sum new.html
          grep -q 'function jsArg' new.html
          grep -q 'function safeWarna' new.html
          grep -q 'lapisanPing' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.26: patch keamanan XSS (jsArg/safeWarna/safeUrl) + pin supabase-js"
          git rm -q .github/workflows/posel-v4326.yml .github/posel_v4326.txt || true
          git commit -m "chore: cleanup v4.3.26 workflow"
          git push
