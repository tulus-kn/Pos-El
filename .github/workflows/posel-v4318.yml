name: posel-v4318
on:
  push:
    paths: ['.github/posel_v4318.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/0I7guS3uWf" -o new.html
          md5sum new.html
          grep -q 'window.bagikanApp' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.18: fix tombol Bagikan & Pasang (export window)"
          git rm -q .github/workflows/posel-v4318.yml .github/posel_v4318.txt || true
          git commit -m "chore: cleanup v4.3.18 workflow"
          git push
