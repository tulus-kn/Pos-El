name: posel-v426
on:
  push:
    paths: ['.github/posel_v426.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/QvrqKfb7Z7" -o new.html
          md5sum new.html
          grep -q 'ckPingLatar' new.html
          grep -q 'mulaiPingLatar' new.html
          cp new.html index.html
      - name: commit and cleanup
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.2.6: ping latar (toggle APK)"
          git rm -q .github/workflows/posel-v426.yml .github/posel_v426.txt || true
          git commit -m "chore: cleanup v4.2.6 workflow"
          git push
