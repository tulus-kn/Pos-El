name: posel-v4316
on:
  push:
    paths: ['.github/posel_v4316.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/Zt6B3vYB9y" -o new.html
          md5sum new.html
          grep -q 'chat-meta' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.16: kolom jam/tanggal di daftar chat"
          git rm -q .github/workflows/posel-v4316.yml .github/posel_v4316.txt || true
          git commit -m "chore: cleanup v4.3.16 workflow"
          git push
