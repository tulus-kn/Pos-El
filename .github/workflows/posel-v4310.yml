name: posel-v4310
on:
  push:
    paths: ['.github/posel_v4310.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/sL7G6VQpdF" -o new.html
          md5sum new.html
          grep -q 'PIN ••••' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.10: samarkan PIN di daftar chat"
          git rm -q .github/workflows/posel-v4310.yml .github/posel_v4310.txt || true
          git commit -m "chore: cleanup v4.3.10 workflow"
          git push
