name: posel-v4327
on:
  push:
    paths: ['.github/posel_v4327.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/T3rO6zDsRC" -o new.html
          md5sum new.html
          grep -q 'pesanGalatRekam' new.html
          grep -q 'pilihAudioStory' new.html
          grep -q 'jsArg' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.27: pesan galat mikrofon jelas + fallback pilih file audio (story suara)"
          git rm -q .github/workflows/posel-v4327.yml .github/posel_v4327.txt || true
          git commit -m "chore: cleanup v4.3.27 workflow"
          git push
