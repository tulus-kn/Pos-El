name: posel-v4323
on:
  push:
    paths: ['.github/posel_v4323.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/ocsP7JQYcu" -o new.html
          md5sum new.html
          grep -q 'suaraBuzz' new.html
          grep -q 'poselShake 1s' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.23: BUZZ gaya Yahoo Messenger (getar 1s + bzzz)"
          git rm -q .github/workflows/posel-v4323.yml .github/posel_v4323.txt || true
          git commit -m "chore: cleanup v4.3.23 workflow"
          git push
