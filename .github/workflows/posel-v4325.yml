name: posel-v4325
on:
  push:
    paths: ['.github/posel_v4325.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/8naej7mrHe" -o new.html
          md5sum new.html
          grep -q 'lapisanPing' new.html
          grep -q 'cekPingTertunda' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.25: PING layar penuh + getar halaman target + cek ping tertunda"
          git rm -q .github/workflows/posel-v4325.yml .github/posel_v4325.txt || true
          git commit -m "chore: cleanup v4.3.25 workflow"
          git push
