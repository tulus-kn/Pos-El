name: posel-v4329
on:
  push:
    paths: ['.github/posel_v4329.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/guO8jrV4ow" -o new.html
          md5sum new.html
          grep -q 'kirimBalasStory' new.html
          grep -q 'vwKetik' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.29: balas story model Instagram (ketik & kirim tanpa keluar viewer)"
          git rm -q .github/workflows/posel-v4329.yml .github/posel_v4329.txt || true
          git commit -m "chore: cleanup v4.3.29 workflow"
          git push
