name: posel-v4330
on:
  push:
    paths: ['.github/posel_v4330.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/UBXeU9lnto" -o new.html
          md5sum new.html
          grep -q 'story-tag' new.html
          grep -q '[STORY]' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.30: label Membalas story di bubble chat + preview"
          git rm -q .github/workflows/posel-v4330.yml .github/posel_v4330.txt || true
          git commit -m "chore: cleanup v4.3.30 workflow"
          git push
