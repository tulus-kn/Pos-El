name: posel-v435
on:
  push:
    paths: ['.github/posel_v435.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/6EP2aNiJOz" -o new.html
          md5sum new.html
          grep -q 'Tekan sekali lagi untuk keluar' new.html
          cp new.html index.html
      - name: commit and cleanup
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.5: back navigasi + tekan 2x untuk keluar"
          git rm -q .github/workflows/posel-v435.yml .github/posel_v435.txt || true
          git commit -m "chore: cleanup v4.3.5 workflow"
          git push
