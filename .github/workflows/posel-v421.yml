name: posel-v421
on:
  push:
    paths:
      - '.github/posel_v421.txt'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy v4.2.1
        run: |
          curl -fsSL 'https://aka.doubaocdn.com/s/W7wK92bg2R' -o /tmp/new.html
          test -s /tmp/new.html
          grep -q 'npSync' /tmp/new.html
          grep -q 'mintaIzinNotif' /tmp/new.html
          python3 -c "import re;s=open('/tmp/new.html').read();m=re.search(r'<script type=\"module\">(.+?)</script>',s,re.S);open('/tmp/m.js','w').write(m.group(1))"
          node --check /tmp/m.js
          cp /tmp/new.html index.html
          git config user.name 'Pos-El Bot'
          git config user.email 'bot@pos-el.local'
          git rm -f .github/posel_v421.txt .github/workflows/posel-v421.yml
          git add -A
          git commit -m 'v4.2.1: judul lagu/video dari app lain (APK) + info izin notifikasi'
          git push origin HEAD:main
