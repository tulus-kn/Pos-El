name: posel-v4324
on:
  push:
    paths: ['.github/posel_v4324.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/Wc52s9K2Nh" -o new.html
          md5sum new.html
          grep -q 'document.querySelector(".app")' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.24: BUZZ animasi di kontainer .app (bukan body)"
          git rm -q .github/workflows/posel-v4324.yml .github/posel_v4324.txt || true
          git commit -m "chore: cleanup v4.3.24 workflow"
          git push
