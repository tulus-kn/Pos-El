name: Pos-El UI v3.7
on:
  push:
    paths:
      - '.github/posel_ui37.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch UI
        run: |
          curl -fsSL https://aka.doubaocdn.com/s/G1wupk9p5b -o /tmp/p.py
          python3 /tmp/p.py
          python3 - <<'PY'
          import re
          s = open('index.html').read()
          m = re.search(r'<script type="module">(.*?)</script>', s, re.S)
          open('/tmp/mod.js','w').write(m.group(1))
          PY
          node --check /tmp/mod.js
      - name: Commit
        run: |
          git config user.name "Pos-El Bot"
          git config user.email "bot@pos-el.local"
          rm -f .github/posel_ui37.txt .github/workflows/posel-ui37.yml
          git add -A
          git commit -m "UI v3.7: tampilan BBM klasik + ikon baru"
          git push origin HEAD:main
