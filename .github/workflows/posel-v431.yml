name: posel-v431
on:
  push:
    paths: ['.github/posel_v431.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/wFpIxnDKyU" -o new.html
          md5sum new.html
          grep -q 'muatStories' new.html
          grep -q 'vwBody' new.html
          cp new.html index.html
      - name: commit and cleanup
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.1: story teks/foto/video/suara/musik"
          git rm -q .github/workflows/posel-v431.yml .github/posel_v431.txt || true
          git commit -m "chore: cleanup v4.3.1 workflow"
          git push
