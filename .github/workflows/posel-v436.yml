name: posel-v436
on:
  push:
    paths: ['.github/posel_v436.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/5zDuzSirZ8" -o new.html
          md5sum new.html
          grep -q 'pfNamaLihat' new.html
          grep -q 'pfModeEdit' new.html
          cp new.html index.html
      - name: commit and cleanup
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.6: profil lihat dulu, edit kalau mau"
          git rm -q .github/workflows/posel-v436.yml .github/posel_v436.txt || true
          git commit -m "chore: cleanup v4.3.6 workflow"
          git push
