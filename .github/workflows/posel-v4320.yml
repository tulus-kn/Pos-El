name: posel-v4320
on:
  push:
    paths: ['.github/posel_v4320.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/UmXLTCCP2S" -o new.html
          md5sum new.html
          grep -q 'bagikanFB' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.20: tambah tombol Facebook & Instagram"
          git rm -q .github/workflows/posel-v4320.yml .github/posel_v4320.txt || true
          git commit -m "chore: cleanup v4.3.20 workflow"
          git push
