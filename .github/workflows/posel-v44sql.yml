name: posel-v44sql
on:
  push:
    paths: ['.github/posel_v44sql.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/AU8xnBX1Ie" -o h.sql
          md5sum h.sql
          grep -q 'HARDENING keamanan database' h.sql
          grep -q 'posel_media_milik' h.sql
          cp h.sql supabase/posel-v4.4-hardening.sql
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add supabase/posel-v4.4-hardening.sql
          git commit -m "v4.4: SQL hardening keamanan (kontak, pesan, story, storage)"
          git rm -q .github/workflows/posel-v44sql.yml .github/posel_v44sql.txt || true
          git commit -m "chore: cleanup v4.4 sql workflow"
          git push
