name: posel-v4313
on:
  push:
    paths: ['.github/posel_v4313.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/TtmGxPjvM7" -o new.html
          md5sum new.html
          grep -q 'BBM sintetis (default)' new.html
          grep -q 'BBM asli (file)' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.13: nada asli jadi opsi, sintetis tetap default"
          git rm -q .github/workflows/posel-v4313.yml .github/posel_v4313.txt || true
          git commit -m "chore: cleanup v4.3.13 workflow"
          git push
