name: posel-v4315
on:
  push:
    paths: ['.github/posel_v4315.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/pBeNaGUBXG" -o new.html
          md5sum new.html
          grep -q 'kosong-pesan' new.html
          grep -q 'muatPesanRingkas' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.15: lencana pesan belum dibaca + preview pesan terakhir"
          git rm -q .github/workflows/posel-v4315.yml .github/posel_v4315.txt || true
          git commit -m "chore: cleanup v4.3.15 workflow"
          git push
