name: posel-patch
on:
  push:
    branches: [ main ]
    paths:
      - '.github/posel-v3.5.patch'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply patch and push
        run: |
          set -e
          git config user.name "Pos-El Bot"
          git config user.email "posel-bot@users.noreply.github.com"
          git apply --verbose .github/posel-v3.5.patch
          rm -f .github/posel-v3.5.patch .github/workflows/posel-patch.yml
          git add -A
          git commit -m "Pos-El v3.5: privasi PIN, cegah join grup sembarang, urutan pesan"
          git push origin HEAD:main
