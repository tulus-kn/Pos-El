name: posel-patch
on:
  push:
    branches: [ main ]
    paths:
      - '.github/posel_trigger_v36.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply patch and push
        run: |
          set -e
          git config user.name "Pos-El Bot"
          git config user.email "posel-bot@users.noreply.github.com"
          curl -fsSL "https://aka.doubaocdn.com/s/STXsLCjUqt" -o /tmp/posel_patch.py
          python3 /tmp/posel_patch.py
          rm -f .github/posel_trigger_v36.txt .github/workflows/posel-patch.yml
          git add -A
          git commit -m "Pos-El v3.6: keluar grup, centang D, pin CDN, batas PIN, fix rekursi grup"
          git push origin HEAD:main
