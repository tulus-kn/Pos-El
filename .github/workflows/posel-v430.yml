name: posel-v430
on:
  push:
    paths: ['.github/posel_v430.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/eMQmPrcUQD" -o new.html
          md5sum new.html
          grep -q 'bukaDrawer' new.html
          grep -q 'poselBack' new.html
          cp new.html index.html
      - name: commit and cleanup
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.0: navigasi gaya Telegram (drawer)"
          git rm -q .github/workflows/posel-v430.yml .github/posel_v430.txt || true
          git commit -m "chore: cleanup v4.3.0 workflow"
          git push
