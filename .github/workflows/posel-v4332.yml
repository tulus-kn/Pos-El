name: posel-v4332
on:
  push:
    paths: ['.github/posel_v4332.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/g0Dy2PwVMn" -o new.html
          md5sum new.html
          grep -q 'panel-refresh' new.html
          grep -q 'bersihkanCache' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.32: panel Versi & Pembaruan di tab Saya (muat ulang / hapus cache)"
          git rm -q .github/workflows/posel-v4332.yml .github/posel_v4332.txt || true
          git commit -m "chore: cleanup v4.3.32 workflow"
          git push
