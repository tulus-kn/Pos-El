name: posel-v437
on:
  push:
    paths: ['.github/posel_v437.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/J4zySDDJjT" -o new.html
          md5sum new.html
          grep -q 'perbaruiToken' new.html
          cp new.html index.html
      - name: commit and cleanup
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.7: kirim token baru ke layanan ping"
          git rm -q .github/workflows/posel-v437.yml .github/posel_v437.txt || true
          git commit -m "chore: cleanup v4.3.7 workflow"
          git push
