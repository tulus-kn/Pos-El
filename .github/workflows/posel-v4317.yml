name: posel-v4317
on:
  push:
    paths: ['.github/posel_v4317.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/c9cU2bm6gY" -o new.html
          md5sum new.html
          grep -q 'Bagikan Pos-El' new.html
          grep -q 'threads.net/intent' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.17: panel Bagikan Pos-El (Threads/WA/APK)"
          git rm -q .github/workflows/posel-v4317.yml .github/posel_v4317.txt || true
          git commit -m "chore: cleanup v4.3.17 workflow"
          git push
