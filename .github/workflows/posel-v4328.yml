name: posel-v4328
on:
  push:
    paths: ['.github/posel_v4328.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/fk72H37cxK" -o new.html
          md5sum new.html
          grep -q 'vwHati' new.html
          grep -q 'Suka story kamu' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.28: tombol balas & suka story jadi button, suka terkirim sebagai pesan"
          git rm -q .github/workflows/posel-v4328.yml .github/posel_v4328.txt || true
          git commit -m "chore: cleanup v4.3.28 workflow"
          git push
