name: posel-v432
on:
  push:
    paths: ['.github/posel_v432.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/wspWw9WWHP" -o new.html
          md5sum new.html
          grep -q 'Tambah story' new.html
          grep -q 'hapusStoryIni' new.html
          cp new.html index.html
      - name: commit and cleanup
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.2: tombol tambah story + hapus story"
          git rm -q .github/workflows/posel-v432.yml .github/posel_v432.txt || true
          git commit -m "chore: cleanup v4.3.2 workflow"
          git push
