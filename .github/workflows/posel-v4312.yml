name: posel-v4312
on:
  push:
    paths: ['.github/posel_v4312.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/eVEuQUDNFq" -o new.html
          md5sum new.html
          grep -q 'suaraBBM' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.12: nada BlackBerry asli untuk Ping"
          git rm -q .github/workflows/posel-v4312.yml .github/posel_v4312.txt || true
          git commit -m "chore: cleanup v4.3.12 workflow"
          git push
