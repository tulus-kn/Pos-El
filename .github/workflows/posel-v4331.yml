name: posel-v4331
on:
  push:
    paths: ['.github/posel_v4331.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/ZJsCBPftQJ" -o new.html
          md5sum new.html
          grep -q 'setVersi' new.html
          grep -q 'muatUlangSegar' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.31: tampilkan versi web + tombol muat ulang paksa"
          git rm -q .github/workflows/posel-v4331.yml .github/posel_v4331.txt || true
          git commit -m "chore: cleanup v4.3.31 workflow"
          git push
