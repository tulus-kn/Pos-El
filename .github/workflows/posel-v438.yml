name: posel-v438
on:
  push:
    paths: ['.github/posel_v438.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/iSVkUb4Dds" -o new.html
          md5sum new.html
          grep -q 'pfNamaLihat' new.html
          grep -q 'id="pfEdit"' new.html
          cp new.html index.html
      - name: commit and cleanup
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.8: edit profil inline di halaman Saya"
          git rm -q .github/workflows/posel-v438.yml .github/posel_v438.txt || true
          git commit -m "chore: cleanup v4.3.8 workflow"
          git push
