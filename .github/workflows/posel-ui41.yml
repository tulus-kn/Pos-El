name: posel-ui41
on:
  push:
    paths:
      - '.github/posel_ui41.txt'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy v4.1
        run: |
          curl -fsSL 'https://aka.doubaocdn.com/s/Ag5NRBlGFM' -o /tmp/new.html
          test -s /tmp/new.html
          grep -q 'posel_reset_password' /tmp/new.html
          grep -q 'pass-eye' /tmp/new.html
          grep -q 'PosElNative' /tmp/new.html
          python3 -c "import re,sys;s=open('/tmp/new.html').read();m=re.search(r'<script type=\"module\">(.+?)</script>',s,re.S);open('/tmp/m.js','w').write(m.group(1))"
          node --check /tmp/m.js
          cp /tmp/new.html index.html
          git config user.name 'Pos-El Bot'
          git config user.email 'bot@pos-el.local'
          git rm -f .github/posel_ui41.txt .github/workflows/posel-ui41.yml
          git add -A
          git commit -m 'v4.1: kode pemulihan password, lihat password, emoji, lampiran foto, getar ping'
          git push origin HEAD:main
