name: posel-v4321
on:
  push:
    paths: ['.github/posel_v4321.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/nJWDsLXz8z" -o new.html
          md5sum new.html
          grep -q 'tempel di kolom' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.21: Facebook salin teks dulu sebelum posting"
          git rm -q .github/workflows/posel-v4321.yml .github/posel_v4321.txt || true
          git commit -m "chore: cleanup v4.3.21 workflow"
          git push
