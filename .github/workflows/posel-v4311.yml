name: posel-v4311
on:
  push:
    paths: ['.github/posel_v4311.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch new html
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/DE6UzeB6D7" -o new.html
          md5sum new.html
          grep -q 'ckSuaraPing' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.11: nada legend BBM/Nokia + mute nada"
          git rm -q .github/workflows/posel-v4311.yml .github/posel_v4311.txt || true
          git commit -m "chore: cleanup v4.3.11 workflow"
          git push
