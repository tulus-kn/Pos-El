name: posel-apk22
on:
  push:
    paths: ['.github/posel_apk22.txt']
permissions:
  contents: write
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: replace apk
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/F2SUVqLVsZ" -o /tmp/Pos-El.apk
          test $(stat -c%s /tmp/Pos-El.apk) -gt 80000
          cp /tmp/Pos-El.apk apk/Pos-El.apk
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add apk/Pos-El.apk
          git commit -m "APK 2.2: fix crash notifikasi (RemoteViews View tidak didukung MIUI)"
          git rm -q .github/workflows/posel-apk22.yml .github/posel_apk22.txt || true
          git commit -m "chore: cleanup apk22 workflow"
          git push
