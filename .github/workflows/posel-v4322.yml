name: posel-v4322
on:
  push:
    paths: ['.github/posel_v4322.txt']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/I577egUR7G" -o new.html
          md5sum new.html
          grep -q 'buzzLayar' new.html
          cp new.html index.html
      - name: commit
        run: |
          git config user.name posel-bot
          git config user.email bot@posel.local
          git add index.html
          git commit -m "v4.3.22: efek BUZZ (layar bergetar) saat PING masuk"
          git rm -q .github/workflows/posel-v4322.yml .github/posel_v4322.txt || true
          git commit -m "chore: cleanup v4.3.22 workflow"
          git push
