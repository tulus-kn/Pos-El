name: posel-ui412
on:
  push:
    paths:
      - '.github/posel_ui412.txt'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy v4.1.2
        run: |
          curl -fsSL 'https://aka.doubaocdn.com/s/Ud0c7rrwgQ' -o /tmp/new.html
          test -s /tmp/new.html
          grep -q 'PosElFitLayar' /tmp/new.html
          grep -q 'chat-aktif' /tmp/new.html
          python3 -c "import re;s=open('/tmp/new.html').read();m=re.search(r'<script type=\"module\">(.+?)</script>',s,re.S);open('/tmp/m.js','w').write(m.group(1))"
          node --check /tmp/m.js
          cp /tmp/new.html index.html
          git config user.name 'Pos-El Bot'
          git config user.email 'bot@pos-el.local'
          git rm -f .github/posel_ui412.txt .github/workflows/posel-ui412.yml
          git add -A
          git commit -m 'v4.1.2: layar chat pas di semua HP (header tidak terpotong, input tidak naik)'
          git push origin HEAD:main
